<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200' style='background:#0a0a0a;'>
  <defs>
    <!-- Scanline Pattern -->
    <pattern id='scanlines' x='0' y='0' width='4' height='4' patternUnits='userSpaceOnUse'>
      <rect width='2' height='4' fill='#000' fill-opacity='0.5' />
    </pattern>
    <!-- Glow Effect -->
    <filter id='amber-glow' x='0' y='0' width='100%' height='100%'>
      <feGaussianBlur in='SourceAlpha' stdDeviation='2' result='blur'/>
      <feMerge>
        <rt> <feFlood flood-color='#ffb000' /> <feComposite in2='blur' /> 
        </rt>
      </feMerge>
    </filter>
  </defs>

  <!-- Background & Scanline Overlay -->
  <rect width='400' height='200' fill='#1a1a1a' />
  <rect width='400' height='200' fill='url(#scanlines)' />

  <!-- Frame -->
  <rect x='10' y='10' width='380' height='180' fill='none' stroke='#ffb000' stroke-width='2' opacity='0.8' />
  
  <!-- Telemetry Data -->
  <text x='30' y='40' fill='#ffb000' font-family='monospace' font-size='12' font-weight='bold'>SYS_STATUS: ACTIVE</text>
  <text x='30' y='70' fill='#ffb000' font-family='monospace' font-size='10'>SIGNAL_STR: 88%</text>
  
  <!-- Battery Indicator -->
  <rect x='250' y='40' width='60' height='10' fill='none' stroke='#ffb000' stroke-width='1' />
  <rect x='250' y='40' width='48' height='10' fill='#ffb000' />
  <text x='250' y='60' fill='#ffb000' font-family='monospace' font-size='8'>PWR_CELL</text>
  
  <!-- Connection Bar -->
  <rect x='30' y='100' width='150' height='4' fill='none' stroke='#ffb000' />
  <rect x='30' y='100' width='140' height='4' fill='#ffb000' />
  <text x='30' y='125' fill='#ffb000' font-family='monospace' font-size='10'>LINK_STABILITY</text>
  
  <!-- Warning Indicator -->
  <circle cx='340' cy='150' r='8' fill='none' stroke='#ffb000' stroke-width='2' />
  <path d='M335 150 L338 153 L345 147' fill="none" stroke="#ffb000" stroke-width="2" />
  <text x='355' y='154' fill='#ffb000' font-family='monospace' font-size='8'>WARN_01</text>

  <!-- Decorative Elements -->
  <line x1='10' y1='190' x2='390' y2='190' stroke='#ffb000' stroke-width='1' />
  <rect x='10' y='180' width='30' height='10' fill="#ffb000" opacity="0.5" />
</svg>